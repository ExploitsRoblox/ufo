<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sala Do Futuro Aluno</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; background: #000; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; font-family: 'Segoe UI', sans-serif;
        }
        #game-wrapper {
            position: relative;
            width: 95vw; height: 53.43vw; 
            max-height: 95vh; max-width: 168.88vh;
            border: 4px solid #333;
        }
        canvas { width: 100%; height: 100%; display: block; background: #001a33; }
        #ui {
            position: absolute; top: 5%; width: 100%; color: white;
            font-size: clamp(16px, 3vw, 28px); text-align: center;
            text-shadow: 2px 2px #000; z-index: 10;
        }
        #msg { pointer-events: auto; cursor: pointer; display: inline-block; margin-top: 6px; }
        .speed-val { font-weight: bold; color: #ff0055; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <header id="ui" role="banner">
            <div id="score" aria-live="polite">Score: 0</div>
            <div id="speed-tag">Velocidade: <span class="speed-val">1x</span></div>
            <div id="msg" role="button" aria-pressed="false" tabindex="0">Aperte Espaço, Toque ou Seta Cima</div>
        </header>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const speedElement = document.querySelector(".speed-val");

        // --- ALTERAÇÃO AQUI: Carregamento da Imagem ---
        const ufoImg = new Image();
        ufoImg.src = 'ufo.png'; // Substitua pelo caminho da sua imagem (png transparente é melhor)

        const W = 1280;
        const H = 720;
        const DPR = Math.max(1, window.devicePixelRatio || 1);
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        let score = 0;
        let gameRunning = false;
        let gameSpeed = 7; 
        const gravity = 0.5;
        const jump = -9;

        const portalTypes = [
            { name: "0.01x", color: "#ff0000", speed: 4 },
            { name: "1x", color: "#00ccff", speed: 7 },
            { name: "1.5x", color: "#Af4Ef3", speed: 9 },
            { name: "2x", color: "#00ff00", speed: 11 },
            { name: "3x", color: "#ff00ff", speed: 15 },
            { name: "4x", color: "#ff3300", speed: 20 },
            { name: "4.5x", color: "#0000ff", speed: 23 },
            { name: "5x", color: "#ffffff", speed: 26 },
            { name: "6x", color: "#ffff00", speed: 30 }, 
        ];

        const ufo = {
            x: 180, y: 360, w: 70, h: 50, // Ajustei levemente o tamanho para a imagem
            velocity: 0,
            draw() {
                // --- ALTERAÇÃO AQUI: Desenha a imagem em vez de formas geométricas ---
                if (ufoImg.complete) {
                    ctx.drawImage(ufoImg, this.x, this.y, this.w, this.h);
                } else {
                    // Fallback caso a imagem não carregue: desenha um retângulo simples
                    ctx.fillStyle = "white";
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                }
            },
            update() {
                if (gameRunning) {
                    this.velocity += gravity;
                    this.y += this.velocity;
                }
                if (this.y + this.h > canvas.height || this.y < 0) gameOver();
            }
        };

        let obstacles = [];

        function createObstacle() {
            const gap = 240;
            const minH = 100;
            const topH = Math.random() * (H - gap - (minH * 2)) + minH;
            const portalConfig = portalTypes[Math.floor(Math.random() * portalTypes.length)];
            
            obstacles.push({
                x: canvas.width,
                topH: topH,
                gap: gap,
                portal: portalConfig,
                portalActive: true,
                passed: false
            });
        }

        function updateObstacles() {
            if (!gameRunning) return;

            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 550) {
                createObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= gameSpeed;

                if (ufo.x + ufo.w > o.x && ufo.x < o.x + 80) {
                    if (ufo.y < o.topH || ufo.y + ufo.h > o.topH + o.gap) {
                        gameOver();
                    }
                }

                if (o.portalActive && ufo.x + ufo.w > o.x && ufo.x < o.x + 80 && ufo.y + ufo.h > o.topH && ufo.y < o.topH + o.gap) {
                    gameSpeed = o.portal.speed;
                    speedElement.innerText = o.portal.name;
                    o.portalActive = false;
                }

                if (!o.passed && o.x + 80 < ufo.x) {
                    score++;
                    document.getElementById("score").innerText = "Score: " + score;
                    o.passed = true;
                }

                if (o.x < -100) obstacles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = "#001122";
            ctx.fillRect(0, 0, W, H);
            
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            for(let x=0; x<W; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, H); ctx.stroke(); }

            obstacles.forEach(o => {
                if(o.portalActive) {
                    ctx.fillStyle = o.portal.color;
                    ctx.shadowBlur = 20; ctx.shadowColor = o.portal.color;
                    ctx.beginPath();
                    ctx.ellipse(o.x + 10, o.topH + o.gap/2, 30, 100, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = "#111";
                ctx.strokeStyle = "#444";
                ctx.lineWidth = 4;
                ctx.fillRect(o.x, 0, 80, o.topH);
                ctx.strokeRect(o.x, 0, 80, o.topH);
                ctx.fillRect(o.x, o.topH + o.gap, 80, H);
                ctx.strokeRect(o.x, o.topH + o.gap, 80, H);
            });

            ufo.draw();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById("msg").innerText = "GAME OVER - Clique para Reiniciar";
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 7;
            ufo.y = 360;
            ufo.velocity = 0;
            document.getElementById("score").innerText = "Score: 0";
            speedElement.innerText = "1x";
            document.getElementById("msg").innerText = "";
            gameRunning = true;
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                if (!gameRunning) resetGame();
                else ufo.velocity = jump;
            }
        });

        const startEl = document.getElementById('msg');
        const handleAction = (e) => {
            e.preventDefault();
            if (!gameRunning) resetGame();
            else ufo.velocity = jump;
        };

        startEl.addEventListener('mousedown', handleAction);
        startEl.addEventListener('touchstart', handleAction, {passive:false});

        function gameLoop() {
            ufo.update();
            updateObstacles();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // --- ALTERAÇÃO AQUI: Só inicia o loop após a imagem carregar ---
        ufoImg.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
